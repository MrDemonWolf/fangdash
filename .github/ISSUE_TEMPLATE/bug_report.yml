name: Bug report
description: Report a bug in FangDash
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to '...'
        2. Start a '...' run
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false

  - type: dropdown
    id: mode
    attributes:
      label: Game mode
      options:
        - Solo
        - Multiplayer race
        - Leaderboard / account
        - Other / not sure
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser & OS
      description: e.g. "Chrome 131 on Windows 11", "Safari 18 on macOS 26"
      placeholder: Chrome 131 on Windows 11
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Paste any errors from the browser devtools console (F12 → Console).
      render: shell
    validations:
      required: false
