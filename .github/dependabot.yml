version: 2
updates:
  # Dependabot only manages GitHub Actions here. JS deps are on Bun, and
  # Dependabot's Bun (bun.lock) support is still immature — leave those to
  # `bun update` / manual bumps rather than opening broken PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
